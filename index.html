<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/pwa-pwa-equipo1/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AURA VITAE · PymeSync Skincare CRM — Gestión inteligente para tu negocio de skincare.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5E3F44">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AURA VITAE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Aquí NO va un enlace a Google Fonts.

    Montserrat e Inter se empaquetan como assets (ver `pubspec.yaml`).
    Enlazarlas desde aquí no funcionaba: el renderer pinta el texto sobre
    un canvas, así que ninguna familia del design system la usa un
    elemento del DOM, y el navegador solo descarga una webfont cuando el
    DOM la necesita. La hoja de estilos se bajaba y los archivos de
    fuente nunca — el motor tiraba de Roboto para todo.

    Si vuelve a hacer falta una fuente, va empaquetada, no enlazada. Eso
    además la mete en el caché del service worker, que es lo que la hace
    funcionar sin conexión.
  -->

  <title>AURA VITAE · PymeSync Skincare CRM</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Splash de arranque.

    Flutter web tarda segundos en descargar y evaluar el motor antes de
    pintar su primer frame; sin esto la pantalla queda en blanco todo ese
    tiempo (First Contentful Paint de 10 s en Lighthouse). Los estilos van
    embebidos y con tipografía del sistema a propósito: cualquier archivo
    externo aquí volvería a retrasar el primer pintado.

    `flutter_bootstrap.js` le agrega la clase `is-ready` al <html> cuando
    la app ya montó su primer frame; el splash se desvanece y se retira.
  -->
  <style>
    body { margin: 0; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: linear-gradient(160deg, #F0E7E2 0%, #E6CECE 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      opacity: 1;
      transition: opacity 250ms ease-out;
    }

    #splash-mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #5E3F44;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F0E7E2;
      font-size: 30px;
      line-height: 1;
    }

    #splash-title {
      margin: 0;
      color: #5E3F44;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
    }

    #splash-subtitle {
      margin: 0.4rem 0 0;
      color: #A47E82;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    #splash-bar {
      width: 148px;
      height: 3px;
      border-radius: 999px;
      background: rgba(94, 63, 68, 0.16);
      overflow: hidden;
    }

    #splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #5E3F44;
      animation: splash-slide 1.1s ease-in-out infinite;
    }

    @keyframes splash-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Respeta a quien pidió menos movimiento en su sistema. */
    @media (prefers-reduced-motion: reduce) {
      #splash-bar::after { animation: none; width: 100%; }
      #splash { transition: none; }
    }

    html.is-ready #splash { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Cargando AURA VITAE">
    <div id="splash-mark" aria-hidden="true">&#10047;</div>
    <div>
      <h1 id="splash-title">AURA VITAE</h1>
      <p id="splash-subtitle">PYMESYNC · SKINCARE CRM</p>
    </div>
    <div id="splash-bar" aria-hidden="true"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Service worker de la PWA: app shell con soporte offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
